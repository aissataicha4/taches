<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="تطبيق بسيط لتنظيم المهام من Smart Touch">
  <title>Smart Touch | مهامي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --blue:#2563eb; --ink:#172033; --muted:#64748b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:Tahoma,Arial,sans-serif; background:linear-gradient(135deg,#eaf2ff,#f8fbff); color:var(--ink); padding:24px 14px; }
    .app { width:min(100%,560px); margin:30px auto; background:white; border-radius:24px; padding:24px; box-shadow:0 16px 45px #1e3a8a18; }
    header { text-align:center; margin-bottom:22px; }
    .logo { width:58px;height:58px;display:grid;place-items:center;margin:0 auto 10px;border-radius:18px;background:#dbeafe;color:var(--blue);font-size:28px;font-weight:bold; }
    h1 { margin:0 0 7px;font-size:27px; }
    .sub { color:var(--muted);font-size:14px; }
    form { display:flex;gap:9px;margin:22px 0 16px; }
    input { min-width:0;flex:1;border:1px solid #dbe3ef;border-radius:13px;padding:14px;font:inherit;outline:none; }
    input:focus { border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18; }
    button { border:0;border-radius:13px;padding:12px 17px;font:inherit;font-weight:bold;cursor:pointer; }
    .add { background:var(--blue);color:white; }
    .add:hover { background:#1d4ed8; }
    .toolbar { display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;color:var(--muted);font-size:13px; }
    .clear { background:#fee2e2;color:#b91c1c;padding:8px 11px;font-size:12px; }
    ul { list-style:none;padding:0;margin:0; }
    li { display:flex;align-items:center;gap:10px;padding:13px 11px;border:1px solid #edf1f7;border-radius:14px;margin:9px 0; }
    li.done .task-text { text-decoration:line-through;color:#94a3b8; }
    .task-text { flex:1;overflow-wrap:anywhere; }
    .check { width:22px;height:22px;accent-color:var(--blue);cursor:pointer; }
    .delete { background:#f1f5f9;color:#475569;padding:8px 10px;font-size:12px; }
    .empty { text-align:center;color:#94a3b8;padding:25px 8px; }
    footer { text-align:center;color:#94a3b8;font-size:12px;margin-top:23px; }
    #installBtn { display:none;margin:12px auto 0;background:#dcfce7;color:#166534; }
    @media(max-width:420px){.app{padding:18px}.add{padding:12px}.toolbar{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">ST</div>
      <h1>قائمة مهامي</h1>
      <div class="sub">نظّمي يومك بخطوات صغيرة ✨</div>
      <button id="installBtn" type="button">تثبيت التطبيق على الهاتف</button>
    </header>
    <form id="taskForm">
      <input id="taskInput" type="text" maxlength="120" placeholder="اكتبي مهمة جديدة..." autocomplete="off" required>
      <button class="add" type="submit">＋ إضافة</button>
    </form>
    <div class="toolbar">
      <span id="counter">0 مهام</span>
      <button id="clearDone" class="clear" type="button">حذف المكتملة</button>
    </div>
    <ul id="taskList" aria-live="polite"></ul>
    <footer>Smart Touch • تطبيق تجريبي تعليمي</footer>
  </main>
<script>
(() => {
  const STORAGE_KEY = "smart-touch-tasks-v1";
  const form = document.getElementById("taskForm");
  const input = document.getElementById("taskInput");
  const list = document.getElementById("taskList");
  const counter = document.getElementById("counter");
  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { tasks = []; }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
  function render() {
    list.replaceChildren();
    const remaining = tasks.filter(t => !t.done).length;
    counter.textContent = `${remaining} متبقية • ${tasks.length} إجمالي`;
    if (!tasks.length) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "لا توجد مهام بعد. أضيفي أول مهمة 😊";
      list.append(empty);
      return;
    }
    tasks.forEach(task => {
      const li = document.createElement("li");
      if (task.done) li.classList.add("done");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "check";
      checkbox.checked = task.done;
      checkbox.setAttribute("aria-label", "تحديد المهمة كمكتملة");
      checkbox.addEventListener("change", () => {
        task.done = checkbox.checked; save(); render();
      });
      const span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;
      const del = document.createElement("button");
      del.className = "delete";
      del.type = "button";
      del.textContent = "حذف";
      del.addEventListener("click", () => {
        tasks = tasks.filter(t => t.id !== task.id); save(); render();
      });
      li.append(checkbox, span, del);
      list.append(li);
    });
  }
  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now() + Math.random(), text, done: false });
    save(); render(); input.value = ""; input.focus();
  });
  document.getElementById("clearDone").addEventListener("click", () => {
    tasks = tasks.filter(t => !t.done); save(); render();
  });
  render();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn));
  }
  let installPrompt;
  const installBtn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault(); installPrompt = event; installBtn.style.display = "inline-block";
  });
  installBtn.addEventListener("click", async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installBtn.style.display = "none";
  });
})();
</script>
</body>
</html>
